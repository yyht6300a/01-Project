# LoRA SFT v3 for TC2 (A40): resume from the v1 best adapter and continue
# training on the merged 4-delivery pool (data_v3, train=8252 / val=705).
# 4-field target (authorization / risk_level / risk_factors / rationale).
run_name: qwen25-1.5b-risk-lora-v3-tc2
base_model: /home/msai/fanlong001/ai6101-train/models/Qwen2.5-1.5B-Instruct

data:
  train: data_v3/train.jsonl
  val: data_v3/val.jsonl

model:
  max_seq_len: 1024
  target_format: "4field"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optim:
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  warmup_ratio: 0.03
  min_warmup_steps: 20
  eta_min_ratio: 0.1

train:
  micro_batch_size: 4
  grad_accum: 4
  max_epochs: 2
  max_steps: -1
  eval_steps: 120
  eval_gen_limit: 256
  eval_batch_size: 16
  grad_checkpoint: true
  early_stop:
    metric: auroc
    patience: 2
    min_delta: 0.002
  seed: 42
  output_dir: runs/qwen25-1.5b-risk-lora-v3-tc2
  resume: true
  resume_reset_metrics: true
