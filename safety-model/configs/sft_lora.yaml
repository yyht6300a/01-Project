# LoRA SFT config for the safety risk model. Paths are relative to safety-model/.
run_name: qwen25-1.5b-risk-lora-v0
base_model: Qwen/Qwen2.5-1.5B-Instruct

data:
  train: data/train.jsonl
  val: data/val.jsonl

model:
  max_seq_len: 1024
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optim:
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  warmup_ratio: 0.03        # linear warmup for the first 3% of optimizer steps
  min_warmup_steps: 20      # ... but at least 20 steps
  eta_min_ratio: 0.1        # cosine decays to 10% of peak lr

train:
  micro_batch_size: 2       # dev machine (8GB): 2 x 8 = 16 effective batch
  grad_accum: 8             # school GPU suggestion: micro=8, accum=4 (32 effective)
  max_epochs: 5
  max_steps: -1             # >0 overrides epochs (smoke tests)
  eval_steps: 200           # optimizer steps between evals (0 = epoch end only)
  eval_gen_limit: 96        # generative AUROC uses at most this many val samples
  eval_batch_size: 8
  grad_checkpoint: false    # enable if the school GPU OOMs
  early_stop:
    metric: auroc           # falls back to -val_loss when AUROC is undefined
    patience: 3
    min_delta: 0.002
  seed: 42
  output_dir: runs/qwen25-1.5b-risk-lora-v0
  resume: false

