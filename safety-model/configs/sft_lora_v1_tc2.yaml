# LoRA SFT for TC2 (school A40, 48GB): target format v2, data_v1 (train=4109 / val=666).
# Counterpart of configs/sft_lora_v1.yaml on the dev machine; same hyperparameters
# (effective batch 16 = micro 8 x accum 2, lr 2e-4, 3 epochs, warmup 3%, cosine to 10%).
# Reference: device defaults to cuda in the job; run from safety-model/ via cluster/submit_train.sbatch.
run_name: qwen25-1.5b-risk-lora-v1-tc2
base_model: /home/msai/fanlong001/ai6101-train/models/Qwen2.5-1.5B-Instruct

data:
  train: data_v1/train.jsonl
  val: data_v1/val.jsonl

model:
  max_seq_len: 1024
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

optim:
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  warmup_ratio: 0.03
  min_warmup_steps: 20
  eta_min_ratio: 0.1

train:
  micro_batch_size: 8
  grad_accum: 2
  max_epochs: 3
  max_steps: -1
  eval_steps: 200
  eval_gen_limit: 96
  eval_batch_size: 16
  grad_checkpoint: false
  early_stop:
    metric: auroc
    patience: 3
    min_delta: 0.002
  seed: 42
  output_dir: runs/qwen25-1.5b-risk-lora-v1-tc2
  resume: false
